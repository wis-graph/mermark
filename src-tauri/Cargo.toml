[package]
name = "mermark"
version = "0.9.20"
description = "Mermaid + Markdown viewer"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mermark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
# OS RNG for `htmlview.rs`'s per-open view token (128-bit random, hex — the
# access-scoping value the htmlview:// protocol's per-token-origin isolation
# rests on, see _workspace/01_architect_design_htmljs.md §10.3). Not a new
# dependency in spirit: tauri itself already pulls getrandom 0.3.x
# transitively (its own webview/updater plumbing), so depending on it
# directly here adds no new crate to the build graph, just names an
# already-compiled one.
getrandom = "0.3"
serde_json = "1"
urlencoding = "2"
# Single-file fs watcher for auto-reload. We use `notify` directly (not
# tauri-plugin-fs) so the watch surface stays exactly one open file with no
# extra `fs:` capability scope — see watcher.rs and 01_architect_design.md.
notify = "6"
# HWP/HWPX viewer backend (native, read-only parse+render). Pinned to a
# specific commit deliberately — upstream `main` is very active and untagged,
# so a branch reference would silently pull in unreviewed code on every build.
# Bump this rev consciously (diff-reviewed) once per release cycle, never as a
# side effect of an unrelated change. See _workspace/01_hwp_viewer.md §1/§6.
rhwp = { git = "https://github.com/edwardkim/rhwp", rev = "93862a4e16df59834ebce46d91e948cd739208e9", default-features = false }
# Tauri already runs a tokio runtime under the hood but doesn't re-export the
# crate, so `hwp.rs`'s parse/render timeouts (`tokio::time::timeout`) need it
# declared explicitly. Kept to the one feature we use — this adds no new
# transitive dependency, since tauri already pulls in full tokio.
tokio = { version = "1", default-features = false, features = ["time"] }
# SQLite DB viewer backend (read-only). Unlike sql.js (loads the whole file
# into a WASM heap -> OOM on a large database), rusqlite lets SQLite read
# pages straight off disk, so opening a multi-gigabyte database costs only
# the pages actually touched. `bundled` statically links SQLite into the
# binary instead of depending on the OS's system libsqlite3 (zero external
# dependency, ~1-1.5MB heavier binary) — a fixed, known-good SQLite version
# beats depending on whatever happens to be installed on the user's machine.
# Pinned to 0.39 rather than the newest 0.40.x: 0.40's `libsqlite3-sys` build
# script calls the standard library's still-unstable `cfg_select!` macro
# unconditionally, so it fails to compile on this repo's stable toolchain
# (rustc 1.92) with "use of unstable library feature `cfg_select`" — a
# libsqlite3-sys build-script bug, not anything about our code. 0.39 depends
# on libsqlite3-sys ^0.37, which predates that macro's introduction and
# builds cleanly; revisit the pin once libsqlite3-sys fixes it upstream.
# `hooks` enables `Connection::progress_handler`, the in-connection wall-clock
# interrupt guard `sqlite.rs` installs on every open (see QUERY_TIMEOUT there)
# — without it, an adversarial database's pathological recursive view (e.g. a
# VIEW over an infinite `WITH RECURSIVE` CTE) can spin a command thread's CPU
# forever with no I/O to time out on.
rusqlite = { version = "=0.39.0", features = ["bundled", "hooks"] }
# Clipboard write for path.copy/bundle.copy. We use `arboard` directly (not
# tauri-plugin-clipboard-manager) so the clipboard surface stays exactly one
# write-only text command with no plugin capability — same reasoning as the
# `notify` pin above. `default-features = false` drops image-data; the macOS
# backend rides on objc2 crates tauri/wry already compile.
arboard = { version = "3", default-features = false }
# EPUB viewer's zip-entry server (`epubview.rs`, `_workspace/01_architect_design_epub.md`
# §1/§2 — `.epub` is a zip, served entry-by-entry with no temp-folder
# extraction). Not a new dependency in spirit: `zip` is already compiled
# twice in this build graph transitively (`rhwp` -> zip 8.6.0 for HWPX,
# `tauri-plugin-updater` -> zip 4.6.1), so naming it directly here — pinned
# to the major version `rhwp` already pulls — adds zero new crates, only a
# direct name for one already-compiled version.
zip = "8"

