[package]
name = "mermark"
version = "0.16.2"
description = "Mermaid + Markdown viewer"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mermark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Routes an ordinary `mermark <file>` launch to the already-running instance
# instead of opening a second window (single-window-opening Todo 2). Installed
# conditionally at runtime — only for `LaunchClass::SingletonRouted` launches,
# never for `-`/`--right` (`Isolated`) — so isolated processes never risk
# being intercepted. See src-tauri/src/single_instance.rs.
tauri-plugin-single-instance = "2.4.3"
# Rust-side native file picker for vault image attachment import
# (single-window-opening Todo 5). Registered as a plugin so its `DialogExt`
# trait/`blocking_pick_file` is available, but no webview-facing dialog
# command is ever invoked from JS — the picker is called from *inside*
# `import_vault_attachment` (attachment_import.rs), never from the frontend.
# That keeps the capability surface at zero: see
# `_workspace/00_adjudication_wave2.md` for the orchestrator's ruling that
# "minimum capability permission" for a Rust-API-only use is 0 entries in
# capabilities/default.json, not the npm-plugin + `dialog:allow-open` route.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# OS RNG for `htmlview.rs`'s per-open view token (128-bit random, hex — the
# access-scoping value the htmlview:// protocol's per-token-origin isolation
# rests on, see _workspace/01_architect_design_htmljs.md §10.3). Not a new
# dependency in spirit: tauri itself already pulls getrandom 0.3.x
# transitively (its own webview/updater plumbing), so depending on it
# directly here adds no new crate to the build graph, just names an
# already-compiled one.
getrandom = "0.3"
serde_json = "1"
urlencoding = "2"
# Single-file fs watcher for auto-reload. We use `notify` directly (not
# tauri-plugin-fs) so the watch surface stays exactly one open file with no
# extra `fs:` capability scope — see watcher.rs and 01_architect_design.md.
notify = "6"
# HWP/HWPX viewer backend (native, read-only parse+render). Pinned to a
# specific commit deliberately — upstream `main` is very active and untagged,
# so a branch reference would silently pull in unreviewed code on every build.
# Bump this rev consciously (diff-reviewed) once per release cycle, never as a
# side effect of an unrelated change. See _workspace/01_hwp_viewer.md §1/§6.
rhwp = { git = "https://github.com/edwardkim/rhwp", rev = "93862a4e16df59834ebce46d91e948cd739208e9", default-features = false }
# Tauri already runs a tokio runtime under the hood but doesn't re-export the
# crate, so `hwp.rs`'s parse/render timeouts (`tokio::time::timeout`) need it
# declared explicitly. Kept to the features actually used in the shipped
# binary — this adds no new transitive dependency, since tauri already pulls
# in full tokio. "net"/"rt"/"rt-multi-thread" are added for the remote-host
# HTTP server (`remote_host::serve`'s `TcpListener::bind`/`axum::serve`).
# "macros" (for `#[tokio::test]`) is deliberately NOT listed here — it's
# test-only, declared instead under [dev-dependencies] below so a release
# build never compiles it in.
tokio = { version = "1", default-features = false, features = ["time", "net", "rt", "rt-multi-thread"] }
# Remote vault host's read-only HTTP server (`remote_host.rs`). The one
# runtime crate this feature is permitted to add — everything it needs
# (tokio, hyper) is already in the build graph via tauri-plugin-updater.
axum = "0.7"
# SQLite DB viewer backend (read-only). Unlike sql.js (loads the whole file
# into a WASM heap -> OOM on a large database), rusqlite lets SQLite read
# pages straight off disk, so opening a multi-gigabyte database costs only
# the pages actually touched. `bundled` statically links SQLite into the
# binary instead of depending on the OS's system libsqlite3 (zero external
# dependency, ~1-1.5MB heavier binary) — a fixed, known-good SQLite version
# beats depending on whatever happens to be installed on the user's machine.
# Pinned to 0.39 rather than the newest 0.40.x: 0.40's `libsqlite3-sys` build
# script calls the standard library's still-unstable `cfg_select!` macro
# unconditionally, so it fails to compile on this repo's stable toolchain
# (rustc 1.92) with "use of unstable library feature `cfg_select`" — a
# libsqlite3-sys build-script bug, not anything about our code. 0.39 depends
# on libsqlite3-sys ^0.37, which predates that macro's introduction and
# builds cleanly; revisit the pin once libsqlite3-sys fixes it upstream.
# `hooks` enables `Connection::progress_handler`, the in-connection wall-clock
# interrupt guard `sqlite.rs` installs on every open (see QUERY_TIMEOUT there)
# — without it, an adversarial database's pathological recursive view (e.g. a
# VIEW over an infinite `WITH RECURSIVE` CTE) can spin a command thread's CPU
# forever with no I/O to time out on.
rusqlite = { version = "=0.39.0", features = ["bundled", "hooks"] }
# Clipboard write for path.copy/bundle.copy. We use `arboard` directly (not
# tauri-plugin-clipboard-manager) so the clipboard surface stays exactly one
# write-only text command with no plugin capability — same reasoning as the
# `notify` pin above. `default-features = false` drops image-data; the macOS
# backend rides on objc2 crates tauri/wry already compile.
arboard = { version = "3", default-features = false }
# EPUB viewer's zip-entry server (`epubview.rs`, `_workspace/01_architect_design_epub.md`
# §1/§2 — `.epub` is a zip, served entry-by-entry with no temp-folder
# extraction). Not a new dependency in spirit: `zip` is already compiled
# twice in this build graph transitively (`rhwp` -> zip 8.6.0 for HWPX,
# `tauri-plugin-updater` -> zip 4.6.1), so naming it directly here — pinned
# to the major version `rhwp` already pulls — adds zero new crates, only a
# direct name for one already-compiled version.
zip = "8"
# Unicode NFC folding for `basename_matches` (commands.rs). macOS often writes
# Korean/other combining-character filenames in NFD (decomposed) form, while a
# document's `![[사진.png]]` link is typed in NFC (composed) — a byte-for-byte
# comparison never matches across the two forms even though they're the same
# text. This crate is the one correct way to fold both sides to a canonical
# form before comparing; hand-rolling NFC decomposition tables is out of scope.
unicode-normalization = "0.1"
# Remote vault client's HTTP calls (`remote_client.rs`). reqwest 0.13.x is
# already compiled in this build graph transitively (tauri's own updater
# plumbing depends on it, via `tauri-plugin-updater = { features = ["json",
# "stream"] }` with `default-features = false`) — naming it directly here
# with the *same* `default-features = false` keeps that small footprint.
# Enabling reqwest's defaults (as an earlier version of this line did) pulls
# in a second TLS stack (rustls + aws-lc-rs/aws-lc-sys, which compiles all of
# AWS-LC from C), HTTP/2, QUIC, and system-proxy detection — 18 extra
# packages in Cargo.lock — for a client that only ever speaks plain `http://`
# to a Tailscale/SSH-tunnel peer and needs none of it. "json" is this
# module's `.json()` response decoding; "query" is `.query(&[...])` (both are
# feature-gated in reqwest 0.13, off by default).
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
# `rustls`'s default crypto provider install (`remote_client.rs`'s
# `ensure_crypto_provider_installed`) — required because turning off
# reqwest's default features (immediately above) also turned off the
# automatic provider install its "default-tls" feature used to trigger, but
# the graph still compiles in rustls/ring (pulled in transitively by
# tauri-plugin-updater's own TLS use), so `reqwest::Client::builder().build()`
# would otherwise panic the first time anything in this process builds one
# (confirmed: reproduced that exact panic with reqwest's default-features
# off and no explicit provider install — see task-6-report.md). `ring` is
# the only feature named — NOT plain `rustls = "0.23"` — because rustls
# 0.23's own *default* features pull in `aws_lc_rs` (a second crypto
# backend, with its from-C `aws-lc-sys` build), which is exactly the bloat
# `default-features = false` on reqwest above was trying to avoid; naming
# only "ring" keeps this to the one backend already compiled transitively.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Client-side data: URL construction for `remote_read_image` (`remote_client.rs`).
# Already compiled transitively as reqwest's own dependency (see above); naming
# it directly avoids hand-rolling base64 encoding without adding a new crate to
# the graph.
base64 = "0.22"

[dev-dependencies]
# `tower::ServiceExt::oneshot` drives `remote_host::router`'s axum `Router`
# directly in tests without binding a real socket. Dev-only: never ships in
# the built app, so it doesn't count against the "one runtime dependency"
# budget for this feature.
tower = { version = "0.4", features = ["util"] }
# Adds the "macros" feature (`#[tokio::test]`) on top of [dependencies]'
# tokio for test builds only. Cargo unions a crate's dependency-kind feature
# sets per build target, so `cargo test` gets "macros" while a normal
# `cargo build`/release binary never does.
tokio = { version = "1", features = ["macros"] }
